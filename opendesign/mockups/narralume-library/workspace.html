<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narralume 书库工作台</title>
  <link rel="stylesheet" href="../../design-systems/narralume-product/tokens/colors_and_type.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; }
    body { margin: 0; background: var(--surface-canvas); color: var(--fg-primary); font: var(--body-size)/var(--body-leading) var(--font-sans); }
    button, input { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; box-shadow: var(--shadow-focus); }
    .app { min-height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }
    .topbar { min-height: 64px; display: flex; align-items: center; gap: var(--space-6); padding: 0 var(--space-6); border-bottom: 1px solid var(--border-subtle); background: var(--surface-primary); }
    .brand { min-width: 220px; }
    .brand strong { display: block; font-size: var(--text-16); letter-spacing: .04em; }
    .brand span { color: var(--fg-muted); font-size: var(--text-11); }
    .phase { display: flex; align-items: center; gap: var(--space-2); color: var(--fg-secondary); font-size: var(--caption-size); }
    .phase::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--status-success); }
    .tools { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }
    .button { min-height: 44px; border: 1px solid transparent; border-radius: var(--radius-md); padding: 0 var(--space-4); font-weight: var(--weight-semibold); cursor: pointer; transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard); }
    .button.primary { background: var(--accent-primary); color: var(--fg-inverse); }
    .button.primary:hover { background: var(--accent-hover); }
    .button.secondary { border-color: var(--border-strong); background: transparent; }
    .button.secondary:hover { background: var(--surface-secondary); }
    .button:disabled { cursor: not-allowed; opacity: .5; }
    .theme { position: relative; }
    .theme-menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 10; width: 148px; padding: var(--space-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-raised); }
    .theme-menu[hidden] { display: none; }
    .theme-menu button { width: 100%; min-height: 44px; border: 0; border-radius: var(--radius-sm); padding: 0 var(--space-3); background: transparent; text-align: left; cursor: pointer; }
    .theme-menu button:hover, .theme-menu button[aria-checked="true"] { background: var(--surface-secondary); }
    .statusbar { min-height: 48px; display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-6); border-bottom: 1px solid var(--border-subtle); background: var(--surface-secondary); color: var(--fg-secondary); }
    .statusbar::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--status-success); }
    .statusbar[data-state="busy"]::before { border: 2px solid var(--accent-primary); border-right-color: transparent; background: transparent; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-meta { margin-left: auto; color: var(--fg-muted); font: var(--text-11)/1.4 var(--font-mono); }
    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(250px, .82fr) minmax(280px, .95fr) minmax(420px, 1.55fr); gap: 1px; background: var(--border-subtle); }
    .pane { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr; background: var(--surface-primary); }
    .pane-head { min-height: 54px; display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-4); border-bottom: 1px solid var(--border-subtle); }
    .pane-head h2 { margin: 0; font-size: var(--text-14); font-weight: var(--weight-semibold); }
    .count { color: var(--fg-muted); font: var(--text-11)/1.4 var(--font-mono); }
    .search { margin-left: auto; width: 116px; min-height: 44px; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0 var(--space-2); background: var(--surface-inset); color: var(--fg-primary); }
    .scroll { min-height: 0; overflow: auto; }
    .list { margin: 0; padding: var(--space-2); list-style: none; }
    .item { width: 100%; min-height: 64px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; text-align: left; cursor: pointer; }
    .item:hover { background: var(--surface-secondary); }
    .item[aria-current="true"] { border-color: var(--border-subtle); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent-primary); }
    .title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--weight-medium); }
    .meta { display: block; margin-top: var(--space-1); color: var(--fg-muted); font: var(--text-11)/1.4 var(--font-mono); }
    .badge { min-height: 24px; display: inline-flex; align-items: center; padding: 0 var(--space-2); border: 1px solid var(--border-subtle); border-radius: 999px; color: var(--fg-secondary); font-size: var(--text-11); }
    .chapter { min-height: 48px; }
    .chapter .index { color: var(--fg-muted); font: var(--text-11)/1.4 var(--font-mono); }
    .chapter-row { position: relative; }
    .chapter-row .chapter { padding-right: 72px; }
    .chapter-delete { position: absolute; top: 2px; right: 4px; min-width: 56px; min-height: 44px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--status-danger); font-weight: var(--weight-semibold); cursor: pointer; opacity: 0; transition: opacity var(--duration-fast) var(--ease-standard), background var(--duration-fast) var(--ease-standard); }
    .chapter-row:hover .chapter-delete, .chapter-row:focus-within .chapter-delete { opacity: 1; }
    .chapter-delete:hover { background: var(--status-danger-soft); }
    .dialog-layer { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: var(--space-4); background: var(--overlay); }
    .dialog-layer[hidden] { display: none; }
    .dialog { width: min(480px, 92vw); display: grid; gap: var(--space-5); padding: var(--space-6); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--surface-primary); box-shadow: var(--shadow-raised); }
    .dialog h2 { margin: 0; font-size: var(--text-20); }
    .dialog p { margin: var(--space-2) 0 0; color: var(--fg-secondary); line-height: 1.75; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); }
    .button.danger { background: var(--status-danger); color: var(--fg-inverse); }
    .reader-wrap { min-height: 0; display: grid; grid-template-rows: auto 1fr auto; }
    .reader-meta { display: flex; flex-wrap: wrap; gap: var(--space-4); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--border-subtle); color: var(--fg-muted); font: var(--text-11)/1.4 var(--font-mono); }
    .reader { min-height: 0; overflow: auto; padding: var(--space-6) clamp(var(--space-5), 4vw, var(--space-10)); background: var(--surface-inset); }
    .reader article { max-width: 720px; margin: 0 auto; }
    .reader h1 { margin: 0 0 var(--space-6); font-size: var(--text-20); font-weight: var(--weight-semibold); }
    .reader p { margin: 0 0 var(--space-4); font: var(--text-16)/var(--leading-reading) var(--font-reading); }
    .reader-foot { min-height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-4); border-top: 1px solid var(--border-subtle); color: var(--fg-muted); font-size: var(--caption-size); }
    .empty { padding: var(--space-8) var(--space-5); color: var(--fg-muted); text-align: center; }
    @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } .pane { min-height: 280px; } .reader-pane { min-height: 560px; } .brand { min-width: auto; } .phase { display: none; } .chapter-delete { opacity: 1; } }
    @media (max-width: 560px) { .topbar { padding: var(--space-3); flex-wrap: wrap; } .tools { width: 100%; margin-left: 0; } .button { flex: 1; } .statusbar { padding: 0 var(--space-3); } .status-meta { display: none; } }
    @media (prefers-reduced-motion: reduce) { .statusbar[data-state="busy"]::before { animation: none; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><strong>Narralume</strong><span>长篇叙事视频工作台</span></div>
      <div class="phase">书库与原文核验</div>
      <div class="tools">
        <div class="theme">
          <button class="button secondary" id="theme-trigger" type="button" aria-haspopup="menu" aria-expanded="false">主题：跟随系统</button>
          <div class="theme-menu" id="theme-menu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-theme-value="system" aria-checked="true">跟随系统</button>
            <button type="button" role="menuitemradio" data-theme-value="light" aria-checked="false">浅色</button>
            <button type="button" role="menuitemradio" data-theme-value="dark" aria-checked="false">深色</button>
          </div>
        </div>
        <button class="button primary" id="import" type="button">导入 TXT</button>
      </div>
    </header>

    <div class="statusbar" id="status" aria-live="polite"><span>书库已就绪，3本书，共64章。</span><span class="status-meta">本地数据 · 最近保存 14:32</span></div>

    <div class="workspace">
      <section class="pane" aria-labelledby="books-title">
        <header class="pane-head"><h2 id="books-title">书籍</h2><span class="count">3 本</span><input class="search" id="book-search" type="search" aria-label="搜索书籍" placeholder="搜索书名" /></header>
        <div class="scroll"><ul class="list" id="book-list"></ul></div>
      </section>

      <section class="pane" aria-labelledby="chapters-title">
        <header class="pane-head"><h2 id="chapters-title">章节</h2><span class="count" id="chapter-count">24 章</span></header>
        <div class="scroll"><ul class="list" id="chapter-list"></ul></div>
      </section>

      <section class="pane reader-pane" aria-labelledby="reader-title">
        <header class="pane-head"><h2 id="reader-title">原文证据</h2><span class="badge">只读</span></header>
        <div class="reader-wrap">
          <div class="reader-meta"><span id="encoding">UTF-8</span><span id="offset">BYTE 000000–001284</span><span id="chars">1,106 字</span></div>
          <div class="reader"><article><h1 id="chapter-title">第一章　退潮线</h1><div id="chapter-copy"></div></article></div>
          <footer class="reader-foot"><span>原文未改写 · 字节偏移可追溯</span><span id="position">1 / 24</span></footer>
        </div>
      </section>
    </div>
    <div class="dialog-layer" id="delete-dialog" hidden>
      <section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-description">
        <div><h2 id="delete-title">永久删除这一章？</h2><p id="delete-description"></p></div>
        <div class="dialog-actions"><button class="button secondary" id="delete-cancel" type="button">取消</button><button class="button danger" id="delete-confirm" type="button">永久删除</button></div>
      </section>
    </div>
  </main>
  <script>
    const books = [
      { id: "tide", title: "潮汐档案", meta: "UTF-8 · 24章 · 18.6万字", count: 24 },
      { id: "station", title: "北站来信", meta: "GB18030 · 12章 · 7.2万字", count: 12 },
      { id: "kiln", title: "旧窑纪事", meta: "UTF-8 · 28章 · 21.4万字", count: 28 }
    ];
    const titles = ["退潮线", "无名来信", "四号仓库", "潮位记录", "最后一班渡轮", "失效的灯塔", "防波堤以北", "回声测量"];
    const paragraphs = [
      "凌晨四点，港区的信号灯依次熄灭。林渡站在防波堤尽头，手里那封没有寄件人的信，被海风折成一道发白的线。",
      "纸上的日期是十七年前。墨水已经洇开，唯独最末一行仍然清楚：退潮以后，不要沿旧铁轨往北走。",
      "远处传来货轮低沉的汽笛。他把信收入外套内袋，回头看见值班室的窗突然亮了。有人站在玻璃后面，却没有开门。"
    ];
    let selectedBook = "tide";
    let selectedChapter = 0;
    let pendingDelete;
    const bookList = document.getElementById("book-list");
    const chapterList = document.getElementById("chapter-list");
    const status = document.getElementById("status");
    function renderBooks(query = "") {
      bookList.innerHTML = "";
      books.filter((book) => book.title.includes(query)).forEach((book) => {
        const li = document.createElement("li");
        const button = document.createElement("button");
        button.className = "item";
        button.type = "button";
        button.setAttribute("aria-current", String(book.id === selectedBook));
        button.innerHTML = `<span><span class="title">${book.title}</span><span class="meta">${book.meta}</span></span><span class="badge">已索引</span>`;
        button.addEventListener("click", () => { selectedBook = book.id; selectedChapter = 0; renderBooks(document.getElementById("book-search").value); renderChapters(); });
        li.append(button); bookList.append(li);
      });
      if (!bookList.children.length) bookList.innerHTML = '<li class="empty">没有匹配的书籍。</li>';
    }
    function renderChapters() {
      const book = books.find((item) => item.id === selectedBook);
      document.getElementById("chapter-count").textContent = `${book.count} 章`;
      document.getElementById("encoding").textContent = book.meta.split(" · ")[0];
      chapterList.innerHTML = "";
      for (let i = 0; i < Math.min(book.count, 16); i += 1) {
        const li = document.createElement("li");
        const button = document.createElement("button");
        button.className = "item chapter";
        button.type = "button";
        button.setAttribute("aria-current", String(i === selectedChapter));
        button.innerHTML = `<span class="title">第${i + 1}章　${titles[i % titles.length]}</span><span class="index">${String(i + 1).padStart(3, "0")}</span>`;
        button.addEventListener("click", () => { selectedChapter = i; renderChapters(); });
        li.className = "chapter-row";
        const remove = document.createElement("button");
        remove.className = "chapter-delete";
        remove.type = "button";
        remove.textContent = "删除";
        remove.setAttribute("aria-label", `删除第${i + 1}章`);
        remove.addEventListener("click", () => {
          pendingDelete = { book, index: i };
          activeDeleteTrigger = remove;
          document.getElementById("delete-description").textContent = `删除后无法恢复第${i + 1}章的本地索引、事件分析和任务记录。原始 TXT 不会被改写。`;
          setDeleteDialogOpen(true);
        });
        li.append(button, remove); chapterList.append(li);
      }
      document.getElementById("chapter-title").textContent = `第${selectedChapter + 1}章　${titles[selectedChapter % titles.length]}`;
      document.getElementById("chapter-copy").innerHTML = paragraphs.map((text) => `<p>${text}</p>`).join("");
      document.getElementById("position").textContent = `${selectedChapter + 1} / ${book.count}`;
      document.getElementById("offset").textContent = `BYTE ${String(selectedChapter * 1285).padStart(6, "0")}–${String((selectedChapter + 1) * 1285 - 1).padStart(6, "0")}`;
      status.firstElementChild.textContent = `已加载《${book.title}》第${selectedChapter + 1}章原文。`;
    }
    document.getElementById("book-search").addEventListener("input", (event) => renderBooks(event.target.value.trim()));
    document.getElementById("import").addEventListener("click", (event) => {
      const button = event.currentTarget;
      button.disabled = true; button.textContent = "正在处理…"; status.dataset.state = "busy"; status.firstElementChild.textContent = "正在读取并索引 TXT，请稍候…";
      setTimeout(() => { button.disabled = false; button.textContent = "导入 TXT"; status.dataset.state = ""; status.firstElementChild.textContent = "演示导入完成，共识别 24章。"; }, 1200);
    });
    let activeDeleteTrigger;
    const deleteDialog = document.getElementById("delete-dialog");
    const deleteDialogSiblings = [...deleteDialog.parentElement.children].filter((element) => element !== deleteDialog);
    function setDeleteDialogOpen(open) {
      deleteDialog.hidden = !open;
      deleteDialogSiblings.forEach((element) => { element.inert = open; });
      if (open) document.getElementById("delete-cancel").focus();
      else activeDeleteTrigger?.focus();
    }
    deleteDialog.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        pendingDelete = undefined;
        setDeleteDialogOpen(false);
        return;
      }
      if (event.key !== "Tab") return;
      const controls = [document.getElementById("delete-cancel"), document.getElementById("delete-confirm")];
      const next = event.shiftKey ? controls[1] : controls[0];
      const wraps = event.shiftKey ? document.activeElement === controls[0] : document.activeElement === controls[1];
      if (wraps) { event.preventDefault(); next.focus(); }
    });
    document.getElementById("delete-cancel").addEventListener("click", () => { pendingDelete = undefined; setDeleteDialogOpen(false); });
    document.getElementById("delete-confirm").addEventListener("click", () => {
      if (!pendingDelete) return;
      pendingDelete.book.count -= 1;
      selectedChapter = Math.min(selectedChapter, Math.max(0, pendingDelete.book.count - 1));
      status.firstElementChild.textContent = `第${pendingDelete.index + 1}章已删除。`;
      pendingDelete = undefined;
      setDeleteDialogOpen(false);
      renderChapters();
    });
    const root = document.documentElement;
    const trigger = document.getElementById("theme-trigger");
    const menu = document.getElementById("theme-menu");
    const themeButtons = [...menu.querySelectorAll("[data-theme-value]")];
    function applyTheme(value) {
      if (value === "system") root.removeAttribute("data-theme"); else root.dataset.theme = value;
      themeButtons.forEach((button) => button.setAttribute("aria-checked", String(button.dataset.themeValue === value)));
      trigger.textContent = `主题：${value === "system" ? "跟随系统" : value === "light" ? "浅色" : "深色"}`;
      localStorage.setItem("narralume-theme", value); menu.hidden = true; trigger.setAttribute("aria-expanded", "false");
    }
    trigger.addEventListener("click", () => { menu.hidden = !menu.hidden; trigger.setAttribute("aria-expanded", String(!menu.hidden)); });
    themeButtons.forEach((button) => button.addEventListener("click", () => applyTheme(button.dataset.themeValue)));
    document.addEventListener("click", (event) => { if (!event.target.closest(".theme")) { menu.hidden = true; trigger.setAttribute("aria-expanded", "false"); } });
    applyTheme(localStorage.getItem("narralume-theme") || "system");
    renderBooks(); renderChapters();
  </script>
</body>
</html>
